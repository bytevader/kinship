name: Detection latency

# kill -9 detection latency at 100 nodes, kinship against hashicorp/memberlist, under the same
# topology and netem. Too long for every pull request, so it runs weekly and on demand; the
# results in docs/results/detection.md come from the same command.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per implementation
        default: "20"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  memberlist:
    name: kill -9 detection, kinship against memberlist, 100 nodes
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/memberlist-bench/go.mod
          cache-dependency-path: tools/memberlist-bench/go.sum
      - name: Install nftables and the netem qdisc
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          sudo modprobe sch_netem || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
      - name: Build the memberlist node
        working-directory: tools/memberlist-bench
        run: go build -o "$RUNNER_TEMP/memberlist-node" .
      - run: cargo build --release -p kinship-chaos
      - name: Run the comparison
        env:
          RUNS: ${{ inputs.runs || '20' }}
        run: |
          target/release/chaos bench --nodes 100 --runs "$RUNS" --seed 14 \
            --memberlist-bin "$RUNNER_TEMP/memberlist-node" --csv detection.csv --logs chaos-logs \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detection
          path: |
            detection.csv
            chaos-logs
