name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude kinship-py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude kinship-py

  wheels:
    name: wheel ${{ matrix.flavor }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
        flavor: [abi3, freethreaded]
        include:
          - flavor: abi3
            python: "3.11"
            build_args: ""
          - flavor: freethreaded
            python: "3.14t"
            build_args: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flavor }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist ${{ matrix.build_args }}
      - name: Test wheel
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-index --find-links dist kinship
          python -m pytest
      - name: Test abi3 wheel on newest CPython
        if: matrix.flavor == 'abi3'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run tests on 3.14
        if: matrix.flavor == 'abi3'
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-index --find-links dist kinship
          python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.flavor }}-${{ matrix.os }}
          path: dist
