name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude kinship-py

  sim-scale:
    name: sim 1,000 nodes x 10 minutes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p kinship-sim --test sim -- --ignored --nocapture

  sim-swim:
    name: SWIM 1,000 seeds x 50 nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A failure prints its seed; replay it with KINSHIP_SEED=<seed> and the same command.
      - run: cargo test --release -p kinship-sim --test swim -- --ignored --nocapture

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude kinship-py

  fuzz:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode_datagram, decode_stream_frame, decode_payload]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kinship-proto/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for 60 seconds from the seed corpus
        working-directory: crates/kinship-proto
        run: cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_total_time=60 -max_len=8192

  wheels:
    name: wheel ${{ matrix.flavor }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
        flavor: [abi3, freethreaded]
        include:
          - flavor: abi3
            python: "3.11"
            build_args: ""
          - flavor: freethreaded
            python: "3.14t"
            build_args: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.flavor }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist ${{ matrix.build_args }}
      - name: Test wheel
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-index --find-links dist kinship
          python -m pytest
      - name: Test abi3 wheel on newest CPython
        if: matrix.flavor == 'abi3'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run tests on 3.14
        if: matrix.flavor == 'abi3'
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-index --find-links dist kinship
          python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.flavor }}-${{ matrix.os }}
          path: dist
