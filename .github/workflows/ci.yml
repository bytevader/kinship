name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes; main runs every push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Same version as .pre-commit-config.yaml, so CI and the hook agree.
      - run: pip install ruff==0.14.0
      - run: ruff check .
      - run: ruff format --check .
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p kinship-py --features test-hooks -- -D warnings

  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --exclude kinship-py

  coverage:
    name: coverage, Rust and Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: coverage
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # One instrumented build serves both suites: cargo test, then pytest against the extension
      # built from the same instrumented code, so the bindings count too. The simulator, the
      # chaos harness, tests and examples are not shipped and are left out of the total.
      - name: Measure coverage
        env:
          IGNORE: "(kinship-sim|tools/chaos|/tests/|/examples/|/fuzz/)"
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # maturin develop installs the dev dependency group with `pip install --group`,
          # which needs pip 25.1 or later; the venv starts with an older one.
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.9,<2" pytest pytest-asyncio pytest-cov
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test --workspace --exclude kinship-py
          maturin develop
          python -m pytest --cov=kinship --cov-report=json:python-coverage.json
          cargo llvm-cov report --ignore-filename-regex "$IGNORE" --summary-only
          cargo llvm-cov report --ignore-filename-regex "$IGNORE" --lcov --output-path rust.lcov
          python .github/coverage_badge.py rust.lcov python-coverage.json coverage.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.json
            rust.lcov
            python-coverage.json

  # The README's coverage badge reads coverage.json from the badges branch, which holds that
  # one file in a single commit, replaced on every push to main.
  coverage-badge:
    name: publish the coverage badge
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Push coverage.json to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir badges && cp coverage/coverage.json badges/ && cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Coverage of $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  sim-scale:
    name: sim 1,000 nodes x 10 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --release -p kinship-sim --test sim -- --ignored --nocapture

  sim-swim:
    name: SWIM 1,000 seeds x 50 nodes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A failure prints its seed; replay it with KINSHIP_SEED=<seed> and the same command.
      - run: cargo test --release -p kinship-sim --test swim -- --ignored --nocapture

  sim-sync:
    name: push-pull, join, leave and metadata, 1,000 seeds each
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A failure prints its seed; replay it with KINSHIP_SEED=<seed> and the same command.
      - run: cargo test --release -p kinship-sim --test sync -- --ignored --nocapture

  sim-keyring:
    name: key rotation, 1,000 seeds each
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A failure prints its seed; replay it with KINSHIP_SEED=<seed> and the same command.
      - run: cargo test --release -p kinship-sim --test keyring -- --ignored --nocapture

  sim-failure:
    name: restart, name conflict, clock jump and long partition, 1,000 seeds each
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A failure prints its seed; replay it with KINSHIP_SEED=<seed> and the same command.
      - run: cargo test --release -p kinship-sim --test failure -- --ignored --nocapture

  chaos:
    name: chaos, 5 nodes under tc netem and nftables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/memberlist-bench/go.mod
          cache-dependency-path: tools/memberlist-bench/go.sum
      - name: Install nftables and the netem qdisc
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          sudo modprobe sch_netem || {
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
      # The memberlist node only has to build here; the comparison runs in detection.yml.
      - name: Check the memberlist node
        working-directory: tools/memberlist-bench
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build -o /dev/null .
      - run: cargo build --release -p kinship-chaos
      # Random loss, kill -9 and a one-way UDP block, 60 s each, on real sockets. A failure
      # prints its scenario, its parameters and the command that replays them.
      - run: target/release/chaos run --nodes 5 --duration 60 --logs chaos-logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-logs
          path: chaos-logs

  audit:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails on any RustSec advisory against a dependency in Cargo.lock.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --exclude kinship-py

  fuzz:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: kinship-proto, target: decode_datagram }
          - { crate: kinship-proto, target: decode_stream_frame }
          - { crate: kinship-proto, target: decode_payload }
          - { crate: kinship-core, target: node_input }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: crates/${{ matrix.crate }}/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz for 60 seconds from the seed corpus
        working-directory: crates/${{ matrix.crate }}
        run: cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_total_time=60 -max_len=8192

  wheels:
    name: wheel ${{ matrix.flavor }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
        flavor: [abi3, freethreaded]
        include:
          - flavor: abi3
            python: "3.11"
            build_args: ""
          - flavor: freethreaded
            python: "3.14t"
            build_args: "--no-default-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so a pull request cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.flavor }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist ${{ matrix.build_args }}
      - name: Test wheel
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-index --find-links dist kinship
          python -m pytest
      # The panic hook stays out of the wheel above, which is the one uploaded. A second build
      # with it runs the one test that needs it.
      - name: Test the actor panic hook
        env:
          KINSHIP_TEST_HOOKS: "1"
        run: |
          maturin build --release --out dist-hooks --features test-hooks ${{ matrix.build_args }}
          python -m pip install --force-reinstall --no-deps --no-index --find-links dist-hooks kinship
          python -m pytest tests/test_panic.py
      - name: Test abi3 wheel on newest CPython
        if: matrix.flavor == 'abi3'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run tests on 3.14
        if: matrix.flavor == 'abi3'
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-index --find-links dist kinship
          python -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.flavor }}-${{ matrix.os }}
          path: dist

  # Alpine and other musl distributions, as release.yml builds them: abi3 wheels from the
  # musllinux_1_2 container, tested in Alpine on the oldest and newest CPython kinship supports.
  wheels-musllinux:
    name: wheel abi3 musllinux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheel (musllinux_1_2)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.arch }}
          manylinux: musllinux_1_2
          args: --release --out dist --interpreter python3.11
      - name: Build wheel with the panic hook (musllinux_1_2)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.arch }}
          manylinux: musllinux_1_2
          args: --release --out dist-hooks --interpreter python3.11 --features test-hooks
      - name: Test wheel on Alpine
        run: |
          for python in 3.11 3.14; do
            docker run --rm -v "$PWD:/io" -w /io "python:${python}-alpine" sh -euc '
              python -m pip install pytest pytest-asyncio
              python -m pip install --no-index --find-links dist kinship
              python -m pytest
              python -m pip install --force-reinstall --no-deps --no-index --find-links dist-hooks kinship
              KINSHIP_TEST_HOOKS=1 python -m pytest tests/test_panic.py
            '
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.arch }}
          path: dist
