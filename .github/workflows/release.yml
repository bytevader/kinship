name: Release

# Publishes a release when a v* tag is pushed, and on nothing else: the abi3 and free-threaded
# wheels, the musllinux abi3 wheels and the sdist to PyPI through trusted publishing, then the
# Rust crates to crates.io in dependency order. Both publish steps skip what is already up, so a
# failed run can be re-run. Once PyPI has the release, a smoke test installs it from there on
# Linux, macOS and Windows and runs the quickstart.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, and never cancelled halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# No rust-cache here: a release builds from a clean slate rather than from a cache another
# workflow wrote.
jobs:
  check:
    name: tag, versions and crate packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check the tag against Cargo.toml and pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crates=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kinship") | .version')
          python=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag $tag, crates $crates, Python package $python"
          test "$tag" = "$crates"
          test "$tag" = "$python"
      # Packages and builds every published crate against the others before anything is uploaded.
      - run: cargo publish --workspace --dry-run --locked

  wheels:
    name: wheel ${{ matrix.flavor }} (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest]
        flavor: [abi3, freethreaded]
        include:
          - flavor: abi3
            python: "3.11"
            build_args: ""
          - flavor: freethreaded
            python: "3.14t"
            build_args: "--no-default-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux wheels are built in the manylinux_2_28 container, so they install on any glibc
      # 2.28 or later rather than only on the runner's own.
      - name: Build wheel (manylinux)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          manylinux: "2_28"
          args: --release --out dist --interpreter python${{ matrix.python }} ${{ matrix.build_args }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: runner.os != 'Linux'
        with:
          toolchain: stable
      - name: Build wheel
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip "maturin>=1.9,<2"
          maturin build --release --out dist ${{ matrix.build_args }}
      - name: Test wheel
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-index --find-links dist kinship
          python -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.flavor }}-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  armv7:
    name: wheel abi3 manylinux (armv7)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheel (manylinux_2_28)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: armv7
          manylinux: "2_28"
          args: --release --out dist --interpreter python3.11
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-abi3-manylinux-armv7
          path: dist
          if-no-files-found: error

  # Alpine and other musl distributions: abi3 wheels built in the musllinux_1_2 container and
  # tested in an Alpine one, since the runner's own Python links glibc.
  musllinux:
    name: wheel abi3 musllinux (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: armv7
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheel (musllinux_1_2)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.arch }}
          manylinux: musllinux_1_2
          args: --release --out dist --interpreter python3.11
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch == 'armv7'
        with:
          platforms: arm
      - name: Test wheel on Alpine
        timeout-minutes: 20
        env:
          IMAGE: ${{ matrix.arch == 'armv7' && 'arm32v7/python:3.11-alpine' || 'python:3.11-alpine' }}
          PLATFORM: ${{ matrix.arch == 'armv7' && 'linux/arm/v7' || matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/io" -w /io "$IMAGE" sh -euc '
            python -m pip install pytest pytest-asyncio
            python -m pip install --no-index --find-links dist kinship
            python -m pytest
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  sdist:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Proves the sdist carries every crate it needs: pip builds a wheel from it alone.
      - name: Build a wheel from the sdist
        run: python -m pip wheel --no-deps --wheel-dir sdist-wheel dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    needs: [wheels, armv7, musllinux, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/kinship
    permissions:
      # Trusted publishing: PyPI exchanges this job's OIDC token for a short-lived upload token.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # Installs the release from PyPI as a user would, with no wheel of our own at hand, and runs
  # the quickstart as two nodes. The index can lag the upload, so the install retries.
  smoke:
    name: PyPI smoke test (${{ matrix.os }})
    needs: pypi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install kinship from PyPI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 20); do
            if python -m pip install --no-cache-dir --only-binary=:all: "kinship==${version}"; then
              exit 0
            fi
            echo "kinship ${version} is not installable yet (attempt ${attempt}); retrying in 30 s"
            sleep 30
          done
          exit 1
      - name: Run the quickstart
        shell: bash
        run: python tools/smoke_quickstart.py "${GITHUB_REF_NAME#v}"

  crates:
    name: publish to crates.io
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/kinship
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Each crate depends on the ones before it. cargo publish returns once the crate is in the
      # index, so the next one resolves it.
      - name: Publish kinship-proto, kinship-core, kinship-net and kinship
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in kinship-proto kinship-core kinship-net kinship; do
            index="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
            if curl -fsS "$index" 2>/dev/null | grep -q "\"vers\":\"${version}\""; then
              echo "${crate} ${version} is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
