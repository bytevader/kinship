[package]
name = "kinship"
description = "SWIM membership and failure detection with Lifeguard, for Rust and Python"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kinship-net.workspace = true
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[[example]]
name = "kinship-agent"
path = "examples/kinship-agent.rs"

[lints]
workspace = true
