[package]
name = "kinship-net"
description = "tokio UDP and TCP driver for kinship-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Not part of the API: `Memberlist::panic_actor`, which kinship-py's tests reach from Python.
test-hooks = []

[dependencies]
kinship-core.workspace = true
kinship-proto.workspace = true
arc-swap = "1.7"
getrandom = "0.3"
socket2 = "0.6"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.41"
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread"] }

[lints]
workspace = true
