[package]
name = "kinship-proto"
description = "kinship wire types, codec and AEAD framing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["network-programming", "encoding", "cryptography"]

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ctutils = { version = "0.4.5", default-features = false }
ed25519-dalek = "=3.0.0"
zeroize = "1.9.0"

[dev-dependencies]
proptest = "1.11.0"
kinship-proto-0-4 = { package = "kinship-proto", version = "=0.4.0" }
