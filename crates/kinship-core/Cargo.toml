[package]
name = "kinship-core"
description = "Sans-IO SWIM and Lifeguard protocol state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["network-programming", "algorithms"]

[features]
# Serialize events, ids and instants, for traces and drivers that export them.
serde = ["dep:serde"]

[dependencies]
chacha20 = { version = "0.10.2", default-features = false, features = ["legacy", "zeroize"] }
kinship-proto.workspace = true
serde = { version = "1", default-features = false, features = ["std", "derive"], optional = true }

[lints]
workspace = true
