[workspace]
resolver = "3"
exclude = ["crates/kinship-proto/fuzz", "crates/kinship-core/fuzz"]
members = [
    "crates/kinship-proto",
    "crates/kinship-core",
    "crates/kinship-sim",
    "crates/kinship-net",
    "crates/kinship-py",
    "crates/kinship",
    "tools/chaos",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/bytevader/kinship"
authors = ["Nikola Stankovic"]
keywords = ["swim", "gossip", "membership", "failure-detection", "cluster"]

[workspace.dependencies]
# The internal crates keep 0.x versions of their own, and each is pinned exactly, so a `kinship`
# release always runs the ones it was built with (docs/stability.md).
kinship-proto = { path = "crates/kinship-proto", version = "=0.6.0" }
kinship-core = { path = "crates/kinship-core", version = "=0.6.0" }
kinship-sim = { path = "crates/kinship-sim" }
kinship-net = { path = "crates/kinship-net", version = "=0.6.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
