# Merge with docker-compose.yml; the base demo remains usable without monitoring.
# Source builds provide the metrics API until it is available in a published release.
x-metrics-node: &metrics-node
  image: kinship-compose-demo-metrics
  build:
    args:
      KINSHIP_INSTALL: source
  environment:
    KINSHIP_METRICS: "1"

services:
  node-1:
    <<: *metrics-node
  node-2:
    <<: *metrics-node
  node-3:
    <<: *metrics-node
  node-4:
    <<: *metrics-node
  node-5:
    <<: *metrics-node

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    ports:
      - "127.0.0.1:${KINSHIP_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [membership, monitoring]

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kinship.json
    ports:
      - "127.0.0.1:${KINSHIP_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]

networks:
  monitoring:

volumes:
  prometheus-data:
  grafana-data:
