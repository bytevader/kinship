<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kinship · live membership</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10171c; color: #e7edf1; }
    body { max-width: 1100px; margin: auto; padding: 32px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { font-size: 32px; letter-spacing: -.04em; margin: 0; }
    h1 span { font-weight: 400; color: #9cabb4; }
    p { color: #9cabb4; line-height: 1.6; }
    #connection { border: 1px solid #43505b; border-radius: 20px; padding: 6px 12px; font-size: 13px; }
    .legend { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0; font-size: 13px; }
    .legend span::before { content: '●'; margin-right: 6px; }
    .ALIVE { --state: #63d5a5; } .SUSPECT { --state: #ffca65; }
    .DEAD { --state: #ff7d85; } .LEFT { --state: #a7a9c3; }
    .legend span { color: var(--state); }
    #members { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    article { background: #19232b; border: 1px solid #32414c; border-top: 4px solid var(--state); border-radius: 8px; padding: 18px; }
    article h2 { font-size: 19px; margin: 0 0 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
    article .state { color: var(--state); font-size: 12px; letter-spacing: .08em; align-self: center; }
    article .address { color: #9cabb4; font: 13px ui-monospace, monospace; }
    article dl { font-size: 14px; margin-bottom: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
    dt { color: #9cabb4; } dd { margin: 0; overflow-wrap: anywhere; }
    .log-heading { margin-top: 32px; display: flex; align-items: baseline; justify-content: space-between; }
    .log-heading h2 { font-size: 18px; } .log-heading span { font-size: 12px; color: #9cabb4; }
    #log { height: 280px; overflow-y: auto; background: #0c1216; border: 1px solid #32414c; border-radius: 8px; padding: 14px; font: 13px/1.8 ui-monospace, monospace; }
    #log div { overflow-wrap: anywhere; } #log time { color: #9cabb4; }
  </style>
</head>
<body>
  <header><h1>kinship <span>/ live membership</span></h1><span id="connection" role="status">Connecting…</span></header>
  <p>The dashboard is a cluster member. These cards show its view of five workers and itself.</p>
  <div class="legend"><span class="ALIVE">ALIVE</span><span class="SUSPECT">SUSPECT</span><span class="DEAD">DEAD</span><span class="LEFT">LEFT</span></div>
  <main id="members" aria-label="Cluster members"></main>
  <div class="log-heading"><h2>Membership events</h2><span>Latest 200 · local timestamps</span></div>
  <div id="log" aria-label="Membership event history"></div>
  <p>Try <code>docker compose pause node-3</code>, wait for DEAD, then <code>docker compose unpause node-3</code>.</p>
  <script>
    const cards = document.querySelector('#members');
    const log = document.querySelector('#log');
    const connection = document.querySelector('#connection');
    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }
    const source = new EventSource('/events');
    source.onopen = () => { connection.textContent = 'Live'; };
    source.onerror = () => { connection.textContent = 'Reconnecting…'; };
    source.onmessage = ({data}) => {
      const snapshot = JSON.parse(data);
      connection.textContent = 'Live';
      const nodes = snapshot.members.map(member => {
        const card = element('article', undefined, member.state);
        card.dataset.member = member.name;
        const heading = element('h2', member.name);
        heading.append(element('span', member.state, 'state'));
        card.append(heading, element('div', member.addr, 'address'));
        const metadata = element('dl');
        for (const [key, value] of Object.entries(member.meta)) {
          metadata.append(element('dt', key), element('dd', value));
        }
        card.append(metadata);
        return card;
      });
      cards.replaceChildren(...nodes);
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
      log.replaceChildren(...snapshot.log.map(entry => {
        const line = element('div');
        const timestamp = element('time', new Date(entry.time).toLocaleTimeString());
        timestamp.dateTime = entry.time;
        timestamp.title = entry.time;
        line.append(timestamp, document.createTextNode(`  ${entry.kind}  ${entry.detail}`));
        return line;
      }));
      if (atBottom) log.scrollTop = log.scrollHeight;
    };
  </script>
</body>
</html>
